version: 2

multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: weekly
    assignees:
      - xfoxfu

updates:
  - package-ecosystem: npm
    directories:
      - /website
      - /uniapi/e2e
    patterns: ["*"]
    multi-ecosystem-group: dependencies

  - package-ecosystem: cargo
    directory: /uniapi
    allow:
      - dependency-type: all
    patterns: ["*"]
    multi-ecosystem-group: dependencies

  - package-ecosystem: docker
    directories:
      - /website
      - /uniapi
    patterns: ["*"]
    multi-ecosystem-group: dependencies

  - package-ecosystem: github-actions
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: dependencies
