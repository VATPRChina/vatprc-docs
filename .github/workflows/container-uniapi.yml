name: UniAPI Container

on:
  push:
    branches: [main]
    paths:
      - "uniapi/**"
      - ".github/workflows/container-uniapi.yml"

permissions:
  contents: read
  packages: write

defaults:
  run:
    working-directory: uniapi

jobs:
  container:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Docker setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata action
        uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/vatprchina/vatprc-docs/uniapi
          tags: |
            type=raw,value=1.2.${{ github.run_number }}

      - name: Publish images
        uses: docker/build-push-action@v5
        with:
          context: ./uniapi
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=gha,scope=uniapi
          cache-to: type=gha,mode=max,scope=uniapi
