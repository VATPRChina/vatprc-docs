name: Website CI

on:
  push:
    paths-ignore:
      - "uniapi/**"
      - ".github/workflows/ci-uniapi.yml"
      - ".github/workflows/container-uniapi.yml"
  pull_request:
    paths-ignore:
      - "uniapi/**"
      - ".github/workflows/ci-uniapi.yml"
      - ".github/workflows/container-uniapi.yml"

defaults:
  run:
    working-directory: website

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        name: Install pnpm
        with:
          package_json_file: website/package.json
      - uses: actions/setup-node@v7
        name: Setup Node.js
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: website/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install
      - name: Install browser for testing
        run: pnpm exec playwright install
      - name: Lint
        run: pnpm lint
      - name: Test
        run: pnpm test
      - name: Test page flows
        run: pnpm test:e2e
      - name: Build
        run: pnpm build
