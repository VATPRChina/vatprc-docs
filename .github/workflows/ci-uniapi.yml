name: UniAPI CI
on:
  push:
    paths:
      - "uniapi/**"
      - ".github/workflows/ci-uniapi.yml"
  pull_request:
    paths:
      - "uniapi/**"
      - ".github/workflows/ci-uniapi.yml"

defaults:
  run:
    working-directory: uniapi

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v7
      - name: Cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            uniapi/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('uniapi/Cargo.lock') }}
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build solution
        run: cargo build --release

      - name: Prepare test data
        run: |
          sudo apt-get update
          sudo apt-get install -y sqlite3
          mkdir -p data
          curl --fail --location --output navdata.zip https://developers.navigraph.com/downloads/navigation-data/navigraph-dfd-sample-sqlite-dfdv2-2401.zip
          unzip -p navdata.zip ng_jeppesen_fwdfd_2401.s3db > data/navdata.db
          sqlite3 -bail data/routes.db < assets/test/routes.sql
      - name: Run tests
        run: cargo test --release

  e2e:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres
        env:
          POSTGRES_DB: vatprc
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_USER: postgres
        options: >-
          --health-cmd "pg_isready -U postgres -d vatprc"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Check out repository code
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache server build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            uniapi/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('uniapi/Cargo.lock') }}

      - name: Cache sqlx build
        id: cache-cargo-sqlx
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
          key: ${{ runner.os }}-cargo-install-sqlx-cli-0.8.6

      - name: Install sqlx
        if: steps.cache-cargo-sqlx.outputs.cache-hit != 'true'
        run: cargo install sqlx-cli --version 0.8.6 --locked

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: uniapi/e2e/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: uniapi/e2e/pnpm-lock.yaml

      - name: Prepare navdata
        run: |
          sudo apt-get update
          sudo apt-get install -y sqlite3
          mkdir -p data
          curl --fail --location --output navdata.zip https://developers.navigraph.com/downloads/navigation-data/navigraph-dfd-sample-sqlite-dfdv2-2401.zip
          unzip -p navdata.zip ng_jeppesen_fwdfd_2401.s3db > data/navdata.db
          sqlite3 -bail data/routes.db < assets/test/routes.sql

      - name: Install E2E dependencies
        run: pnpm install --frozen-lockfile
        working-directory: uniapi/e2e

      - name: Build release server
        run: cargo build --release

      - name: Prepare database
        env:
          DATABASE_URL: postgres://postgres@localhost/vatprc
        run: sqlx database setup

      - name: Run E2E tests
        run: pnpm test
        working-directory: uniapi/e2e
        env:
          APP_DATABASE__URL: postgres://postgres@localhost/vatprc
          E2E_BACKEND_BUILD_MODE: release
