name: Website Container

on:
  push:
    branches: [main]
    paths-ignore:
      - "uniapi/**"
      - ".github/workflows/ci-uniapi.yml"
      - ".github/workflows/container-uniapi.yml"

permissions:
  contents: read
  packages: write

jobs:
  container:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Docker setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata action
        uses: docker/metadata-action@v5
        id: meta
        with:
          images: |
            ghcr.io/vatprchina/vatprc-docs/website
          tags: |
            type=raw,value=1.1.${{ github.run_number }}

      - name: Publish images
        uses: docker/build-push-action@v5
        with:
          context: .
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          push: true
          cache-from: type=gha,scope=website
          cache-to: type=gha,mode=max,scope=website
          secrets: |
            SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}
          build-args: |
            VERSION=1.1.${{ github.run_number }}
